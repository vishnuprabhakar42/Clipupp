spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/clipupp_db
    username: postgres
    password: anshu
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        # Surfaces query counts so we can spot N+1 fan-out in dev.
        generate_statistics: true

logging:
  level:
    root: INFO
    com.clipupp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.flywaydb: DEBUG

clipupp:
  jwt:
    secret: dev-only-do-not-use-in-prod-32bytes-min-please-change-me-immediately
  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:3000
  email:
    provider: logging
    from: dev@clipupp.local
  google:
    client-id: ${GOOGLE_CLIENT_ID:1072385341259-92bm5h34k6si1jd4gerro4g22cv0ml98.apps.googleusercontent.com}

  media:
    # Dev reads R2 from the environment like prod does; leave unset to run
    # without media uploads. The keys that used to be checked in here were
    # rotated on 2026-10-15.
    bucket:          ${R2_BUCKET:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    s3-endpoint:     ${R2_ENDPOINT:}
    s3-region:       ${R2_REGION:auto}
    access-key:      ${R2_ACCESS_KEY:dev}
    secret-key:      ${R2_SECRET_KEY:dev}

server:
  error:
    include-message: always
    include-binding-errors: always
