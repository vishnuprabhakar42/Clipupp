spring:
  application:
    name: clipupp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:25}
      minimum-idle: 4
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC
    default-leniency: true

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      # Match MediaService's MAX_SIZE_BYTES (10 MB) so the controller sees
      # the request and MediaService can return its own friendly error,
      # rather than Spring rejecting it at the multipart parser with a
      # generic 500. Slight headroom on max-request-size for
      # multipart envelope overhead.
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    git:
      mode: simple

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  packages-to-scan: com.clipupp

clipupp:
  public-site-url: ${PUBLIC_SITE_URL:http://localhost:3000}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  jwt:
    issuer: clipupp
    audience: clipupp-web
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
  cookie:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ratelimit:
    enabled: true
  outbox:
    poll-ms: 5000
  email:
    provider: ${EMAIL_PROVIDER:resend}
    from: ${EMAIL_FROM:no-reply@clipupp.local}
    resend-api-key: ${RESEND_API_KEY:}
  media:
    bucket: ${R2_BUCKET:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    s3-endpoint: ${R2_ENDPOINT:}
    s3-region: ${R2_REGION:auto}
    access-key: ${R2_ACCESS_KEY:dev}
    secret-key: ${R2_SECRET_KEY:dev}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
