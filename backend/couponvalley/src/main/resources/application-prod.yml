spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

# Hide Swagger UI + the raw OpenAPI document in production. Defence-in-depth
# on top of the SecurityConfig auth requirement: when both flags are false,
# springdoc skips bean registration entirely so /v3/api-docs/** + /swagger-ui*
# return 404 even before SecurityConfig sees the request.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.couponvalley: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","traceId":"%X{traceId:-}","msg":"%msg","ex":"%replace(%ex){''[\r\n]'',''\\\\n''}"}%n'

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
