spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/couponvalley_db
    username: postgres
    password: anshu
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        # Surfaces query counts so we can spot N+1 fan-out in dev.
        generate_statistics: true

logging:
  level:
    root: INFO
    com.couponvalley: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.flywaydb: DEBUG

couponvalley:
