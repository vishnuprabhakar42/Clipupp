  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:3000
  email:
    provider: logging
    from: dev@couponvalley.local
  google:
    client-id: ${GOOGLE_CLIENT_ID:1072385341259-92bm5h34k6si1jd4gerro4g22cv0ml98.apps.googleusercontent.com}

