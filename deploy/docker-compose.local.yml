# Local rehearsal on a developer machine: real images, throwaway database,
# no shared Caddy. Use together with docker-compose.prod.yml:
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.local.yml
# A distinct project name keeps `down -v` away from the repo's dev stack (also project
# "clipupp", with clipupp-postgres and clipupp-adminer).
name: clipupp-rehearsal

services:
  backend:
    image: clipupp-backend:${IMAGE_TAG}
  web:
    image: clipupp-web:${IMAGE_TAG}
    # A range, because docker rollout runs two replicas side by side and one host port cannot be
    # shared; the rehearsal looks the port up with `compose port web 3000`.
    ports: ["3300-3301:3000"]
  backup:
    image: clipupp-backup:${IMAGE_TAG}
networks:
  edge:
    external: false
    name: clipupp-local-edge
