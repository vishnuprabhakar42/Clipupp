name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/couponvalley/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/couponvalley/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend/couponvalley

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Gradle build (compile + test + bootJar)
        run: ./gradlew --no-daemon build
