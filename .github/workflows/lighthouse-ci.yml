name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/couponvalley/**"
      - ".github/workflows/lighthouse-ci.yml"

# Scopes the workflow's GITHUB_TOKEN to read-only (it's used by the
# temporary-public-storage uploader, not by anything that writes).
permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit Lighthouse score budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/couponvalley
    env:
      # Lighthouse needs a backend so detail pages render — without it the
      # SSR fetch fails and the page falls through to the error boundary,
      # which would tank the run. Until the backend is reachable from CI
      # (Docker compose stack, deploy-preview, etc.), the workflow audits
      # only static-shell routes (/, /stores, /coupons, /categories, /blog).
      BACKEND_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/couponvalley/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
