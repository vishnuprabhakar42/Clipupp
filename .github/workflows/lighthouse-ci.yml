name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/clipupp/**"
      - ".github/workflows/lighthouse-ci.yml"

# Scopes the workflow's GITHUB_TOKEN to read-only (it's used by the
# temporary-public-storage uploader, not by anything that writes).
permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit homepage performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/clipupp
    env:
      # No backend in CI: BACKEND_URL stays unset, every backend fetch fails
      # soft, and the demo feed renders the homepage (/ and /hi) from the
      # fixture. Budgets live in lighthouserc.cjs.
      NEXT_PUBLIC_HOME_DEMO_FEED: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/clipupp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Start server
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            # Warm both locales so the first measured page load is not a cold render.
            curl -sf -o /dev/null http://localhost:3000/ && curl -sf -o /dev/null http://localhost:3000/hi && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: Run Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
