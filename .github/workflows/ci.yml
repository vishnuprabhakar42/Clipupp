name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: vishnuprabhakar42

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['backend/clipupp/**', '.github/workflows/ci.yml']
            frontend: ['frontend/clipupp/**', '.github/workflows/ci.yml']
            deploy: ['deploy/**', '.github/workflows/ci.yml']

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend/clipupp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: backend/clipupp/build/reports/tests, retention-days: 7 }

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: frontend/clipupp } }
    # Unit tests run with a clean environment. The demo feed and site URL
    # apply only to the production build and the browser tests against it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/clipupp/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env: { NEXT_PUBLIC_HOME_DEMO_FEED: 'true', NEXT_PUBLIC_SITE_URL: 'http://localhost:3000' }
      - name: Start server
        env: { NEXT_PUBLIC_HOME_DEMO_FEED: 'true', NEXT_PUBLIC_SITE_URL: 'http://localhost:3000' }
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && curl -sf -o /dev/null http://localhost:3000/hi && exit 0
            sleep 1
          done
          cat next-start.log; exit 1
      - run: npm run test:e2e
      - name: Lighthouse budgets (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run lhci
        env: { LHCI_GITHUB_APP_TOKEN: '${{ secrets.LHCI_GITHUB_APP_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/clipupp/node_modules/.cache/playwright
            frontend/clipupp/next-start.log
          retention-days: 7
          include-hidden-files: true

  deploy-assets:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq shellcheck
      - run: shellcheck -x deploy/scripts/*.sh deploy/server-setup.sh deploy/render-env.sh deploy/backup/entrypoint.sh deploy/test/*.sh
      - run: bash deploy/test/render-env.test.sh
      - run: bash deploy/test/compose-config.test.sh
      - run: bash deploy/test/deploy-flow.test.sh

  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  images:
    needs: [changes, backend, frontend, deploy-assets]
    # Always on push to main (CD needs the sha tag); on pull requests only when something relevant changed.
    # Upstream jobs may be skipped by the path filter, so only failure or cancellation blocks.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.deploy == 'true') && needs.backend.result != 'failure' && needs.frontend.result != 'failure' && needs.deploy-assets.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # Every image reports its own scan result; one failure must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - name: clipupp-backend
            context: backend/clipupp
            file: backend/clipupp/Dockerfile
          - name: clipupp-web
            context: frontend/clipupp
            file: frontend/clipupp/Dockerfile
          - name: clipupp-backup
            context: deploy
            file: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://clipupp.com' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.R2_PUBLIC_BASE_URL }}
      - name: Trivy (critical, fixed vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Push (after the scan passes)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://clipupp.com' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.R2_PUBLIC_BASE_URL }}
