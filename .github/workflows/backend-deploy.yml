name: backend-deploy

# Build → publish → redeploy pipeline for the Spring Boot backend.
#
# Flow:
#   1. Wait for backend-ci on this SHA to go green (tests are the gate).
#   2. Build the Dockerfile in backend/couponvalley/ on GitHub's runner,
#      using buildx + GHA cache. Tag with both `latest` and `sha-<short>`.
#   3. Push to GitHub Container Registry (ghcr.io). The image is namespaced
#      under the repo owner — make it Public once after the first push
#      (github.com/<owner>?tab=packages → clipupp-backend → Package settings
#      → Change visibility) so Railway can pull anonymously. Or keep it
#      Private and add registry credentials to the Railway service.
#   4. Tell Railway to redeploy via the Railway CLI, which pulls the new
#      `:latest` digest. Cold redeploy is ~30s because nothing is built
#      Railway-side — it just fetches a pre-built image.
#
# Required GitHub secrets:
#   RAILWAY_TOKEN    — project token from Railway → Project → Tokens
#   RAILWAY_SERVICE  — backend service name as it appears in Railway
#                      (e.g. "backend"). Stored as a secret only because
#                      Actions doesn't expose org-level variables to forks.
#
# GHCR auth uses the built-in GITHUB_TOKEN with `packages: write` scope —
# no PAT needed.

on:
  push:
    branches: [main]
    paths:
      - 'backend/couponvalley/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/clipupp-backend

jobs:
  wait-for-ci:
    name: Wait for backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for backend-ci to succeed on this SHA
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    needs: wait-for-ci
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` for Railway to track + a sha tag for rollback traceability.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: backend/couponvalley
          file: backend/couponvalley/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-backed layer cache — second build of an unchanged dependency
          # set drops to ~90s.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  redeploy-railway:
    name: Redeploy on Railway
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    environment:
      name: production
      url: https://api.clipupp.com
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Trigger redeploy (Railway pulls latest from GHCR)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy --service "${{ secrets.RAILWAY_SERVICE }}" --yes
