name: backend-deploy

# Build → publish → redeploy pipeline for the Spring Boot backend.
#
# Trigger model:
#   - `workflow_run`: fires automatically when `backend-ci` finishes on main.
#     The `if:` gate below only proceeds when CI's conclusion == success, so a
#     failed test never reaches production.
#   - `workflow_dispatch`: lets you redeploy from the Actions tab without
#     pushing a code change. Useful for first-time setup + emergency redeploys.
#
# Why not `lewagon/wait-on-check-action`? It needs `checks: read` scope on the
# default `GITHUB_TOKEN`, which most orgs don't grant by default, and it can't
# tell the difference between "CI hasn't started yet" and "CI was skipped on
# this SHA because the path filter didn't match." `workflow_run` solves both.
#
# Flow:
#   1. backend-ci on main: completed + success.
#   2. Build the Dockerfile in backend/clipupp/ on GitHub's runner,
#      using buildx + GHA cache. Tag with both `latest` and `sha-<short>`.
#   3. Push to GitHub Container Registry (ghcr.io). Make the package Public
#      once after the first push (github.com/<owner>?tab=packages →
#      clipupp-backend → Package settings → Change visibility) so Railway
#      can pull anonymously. Or keep it Private and add registry credentials
#      to the Railway service.
#   4. `railway redeploy` makes the Railway service pull the new `:latest`
#      digest. Cold redeploy is ~30s because nothing builds Railway-side.
#
# Required GitHub secrets:
#   RAILWAY_TOKEN    — project token from Railway → Project → Tokens
#   RAILWAY_SERVICE  — backend service name as it appears in Railway
#                      (e.g. "backend").
#
# GHCR auth uses the built-in GITHUB_TOKEN with `packages: write` scope —
# no PAT needed.

on:
  workflow_run:
    workflows: ['backend-ci']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/clipupp-backend

jobs:
  build-and-push:
    name: Build & push image to GHCR
    # Run on manual dispatch, or when backend-ci finished successfully.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, build the exact SHA that CI passed
          # on — not the latest main, which may have already moved.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` for Railway to track + a sha tag for rollback traceability.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: backend/clipupp
          file: backend/clipupp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-backed layer cache — second build of an unchanged dependency
          # set drops to ~90s.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  redeploy-railway:
    name: Redeploy on Railway
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    environment:
      name: production
      url: https://api.clipupp.com
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Trigger redeploy (Railway pulls latest from GHCR)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy --service "${{ secrets.RAILWAY_SERVICE }}" --yes
