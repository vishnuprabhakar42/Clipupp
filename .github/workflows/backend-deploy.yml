name: backend-deploy

# Deploys the Spring Boot backend to Railway after a green push to main.
# Requires two GitHub secrets:
#   RAILWAY_TOKEN    — project token from Railway → Project Settings → Tokens
#   RAILWAY_SERVICE  — the service name as it appears in the Railway dashboard
#                      (e.g. "backend"). Set as a *variable* if you prefer.
#
# The deploy step is gated on the existing backend-ci workflow passing, so a
# failed test never reaches production. Railway builds the Dockerfile in
# backend/couponvalley/ via the railway.json config.

on:
  push:
    branches: [main]
    paths:
      - 'backend/couponvalley/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for backend-ci to succeed on this SHA
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: wait-for-ci
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.clipupp.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Trigger Railway deploy
        working-directory: backend/couponvalley
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_SERVICE }}" \
            --ci \
            --detach
