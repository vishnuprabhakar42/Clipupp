name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/clipupp/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/clipupp/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend/clipupp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/clipupp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://clipupp.com

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No backend in CI: BACKEND_URL stays unset, every backend fetch fails
      # soft, and the demo feed fills every homepage section from the fixture.
      NEXT_PUBLIC_HOME_DEMO_FEED: 'true'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/clipupp/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            # Warm both locales so the first measured page load is not a cold render.
            curl -sf -o /dev/null http://localhost:3000/ && curl -sf -o /dev/null http://localhost:3000/hi && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: E2E (Playwright + axe)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/clipupp/playwright-report
            frontend/clipupp/test-results
            frontend/clipupp/next-start.log
          retention-days: 7
