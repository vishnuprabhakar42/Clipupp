name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit sha to deploy (default: head of main; must be on main)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.s.outputs.sha }}
      short: ${{ steps.s.outputs.short }}
    steps:
      - name: Run only from main
        env: { REF: '${{ github.ref }}' }
        run: '[ "$REF" = refs/heads/main ] || { echo "::error::Deploy runs only from main (got $REF)"; exit 2; }'
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, persist-credentials: false }
      - id: s
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-$EVENT_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full 40-hex sha: $sha"; exit 2; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

  notify-start:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "Clipupp deploy started: ${{ needs.resolve.outputs.short }} by ${{ github.actor }}. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: [resolve, notify-start]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.resolve.outputs.sha }}' }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.DEPLOY_SSH_KEY }}', host: '${{ secrets.DEPLOY_HOST }}', host_key: '${{ secrets.DEPLOY_HOST_KEY }}', user: '${{ secrets.DEPLOY_USER }}' }
      - name: Render server env from GitHub secrets and variables
        env:
          IMAGE_TAG: sha-${{ needs.resolve.outputs.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          API_BASE_URL: ${{ vars.SITE_URL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.SITE_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.RCLONE_CONFIG_R2_ENDPOINT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          BACKUP_RETAIN_DAYS: ${{ vars.BACKUP_RETAIN_DAYS }}
        run: bash deploy/render-env.sh "$RUNNER_TEMP/env"
      - name: Write backup key file
        env: { BACKUP_KEY: '${{ secrets.BACKUP_KEY }}' }
        run: |
          [ -n "$BACKUP_KEY" ] || { echo "BACKUP_KEY secret is empty"; exit 2; }
          umask 077; printf '%s\n' "$BACKUP_KEY" > "$RUNNER_TEMP/backup-key"
      - name: Preflight (no run in flight, host lock free)
        run: |
          ssh vps 'mkdir -p /opt/clipupp/.deploy && cd /opt/clipupp && { if [ -f .deploy/run.pid ] && kill -0 "$(cat .deploy/run.pid)" 2>/dev/null; then echo "::error::a previous run is still going (pid $(cat .deploy/run.pid)); see .deploy/run.out"; exit 3; fi; flock -n .deploy/lock true || { echo "::error::a deploy, rollback or restore holds .deploy/lock"; exit 3; }; }'
      - name: Ship compose, scripts, env
        run: |
          ssh vps 'mkdir -p /opt/clipupp/scripts /opt/clipupp/.deploy'
          scp -q deploy/docker-compose.prod.yml deploy/clipupp.caddy vps:/opt/clipupp/
          scp -q deploy/scripts/*.sh vps:/opt/clipupp/scripts/
          scp -q "$RUNNER_TEMP/env" vps:/opt/clipupp/.env
          scp -q "$RUNNER_TEMP/backup-key" vps:/opt/clipupp/.backup-key
          ssh vps 'chmod 700 /opt/clipupp/scripts/*.sh && chmod 600 /opt/clipupp/.env /opt/clipupp/.backup-key'
      - name: Deploy (detached on the server)
        env: { GHCR_TOKEN: '${{ secrets.GITHUB_TOKEN }}', ACTOR: '${{ github.actor }}' }
        run: |
          # Clipupp's own docker client config, so the deploy user's shared ~/.docker (other stacks
          # pull from GHCR with it) is never overwritten; deploy.sh uses the same directory.
          # shellcheck disable=SC2029
          printf '%s\n' "$GHCR_TOKEN" | ssh vps "install -d -m 700 /opt/clipupp/.docker && DOCKER_CONFIG=/opt/clipupp/.docker docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null"
          # Only this run's own login is undone at the end; a run refused by the preflight logs nothing out.
          echo "GHCR_LOGGED_IN=1" >> "$GITHUB_ENV"
          # Start deploy.sh in its own session so an ssh drop or job cancel cannot kill it mid-deploy.
          # shellcheck disable=SC2029
          ssh vps "cd /opt/clipupp && { if [ -f .deploy/run.pid ] && kill -0 \"\$(cat .deploy/run.pid)\" 2>/dev/null; then echo \"::error::a previous run is still going\"; exit 3; fi; flock -n .deploy/lock true || { echo \"::error::lock held\"; exit 3; }; } && rm -f .deploy/run.rc && : > .deploy/run.out && { setsid nohup bash -c '( scripts/deploy.sh sha-$SHA; echo \$? > .deploy/run.rc ) > .deploy/run.out 2>&1 < /dev/null' > /dev/null 2>&1 < /dev/null & echo \$! > .deploy/run.pid; }"
          # Follow the detached run's log until it exits; reconnect if only the ssh link dropped (255).
          rc=1
          for attempt in 1 2 3 4 5; do
            rc=0
            ssh vps 'cd /opt/clipupp && tail -n +1 --pid="$(cat .deploy/run.pid)" -f .deploy/run.out; rc="$(cat .deploy/run.rc 2>/dev/null || echo 1)"; exit "$rc"' || rc=$?
            [ "$rc" -ne 255 ] || { echo "ssh dropped (attempt $attempt), reconnecting"; sleep 5; continue; }
            break
          done
          exit "$rc"
      - name: Log the server out of GHCR
        if: always() && env.GHCR_LOGGED_IN == '1'
        run: ssh vps 'DOCKER_CONFIG=/opt/clipupp/.docker docker logout ghcr.io >/dev/null 2>&1 || true'

  smoke:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke checks against ${{ vars.SITE_URL }}
        env: { SITE: '${{ vars.SITE_URL }}', SHA: '${{ needs.resolve.outputs.sha }}' }
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do curl -fsS -o /dev/null "$SITE/api/health" && break; sleep 3; done
          health="$(curl -fsS "$SITE/api/health")"; echo "$health"
          grep -q '"backend":"up"' <<<"$health"
          grep -q "\"version\":\"$SHA\"" <<<"$health"
          curl -fsS -o /dev/null -w "home %{http_code}\n" "$SITE/"
          curl -fsS -o /dev/null -w "hindi %{http_code}\n" "$SITE/hi"
          curl -fsS -o /dev/null -w "homepage api %{http_code}\n" "$SITE/api/v1/homepage"
          [ "$(curl -s "$SITE/" | grep -ci cashback)" = "0" ]

  notify-result:
    needs: [resolve, deploy, smoke]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: >-
            ${{ (needs.deploy.result == 'success' && needs.smoke.result == 'success') && 'Clipupp deployed' || 'Clipupp deploy FAILED' }}:
            ${{ needs.resolve.outputs.short }} (deploy ${{ needs.deploy.result }}, smoke ${{ needs.smoke.result }}).
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ${{ (needs.deploy.result == 'success' && needs.smoke.result == 'success') && '' || 'Rollback: Actions > Rollback > Run workflow.' }}
