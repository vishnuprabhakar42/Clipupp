name: openapi-sync

# Sprint 1: starts firing once the backend exposes real endpoints under
# /v3/api-docs/v1. Today PingController is the only endpoint, so this workflow
# is a stub — manual dispatch only — until Sprint 1 ships auth + users.
#
# What it will do (Sprint 1+):
#   1. Boot the backend in CI, dump /v3/api-docs/v1 to a JSON file
#   2. Run openapi-typescript against it -> frontend/couponvalley/lib/api/generated/schema.ts
#   3. Open a PR if the generated types changed
#
# Until then, regenerate locally via: cd frontend/couponvalley && npm run openapi:gen

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "openapi-sync runs starting Sprint 1 (after auth endpoints land)."
