services:
  postgres:
    image: postgres:16-alpine
    container_name: clipupp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-clipupp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clipupp}
      POSTGRES_DB: ${DB_NAME:-clipupp}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - clipupp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:latest
    container_name: clipupp-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  clipupp-pgdata:
    driver: local
